name: Deploy to GitHub Pages

# Publishes the site on every push to main, and every six hours so the
# Instagram grid on the home page keeps up with new posts. The site is plain
# static files; the only build step fills that grid (tools/instagram.py), and
# it never fails a deploy — with no feed connected it leaves the page as it is.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The feed address is a repository secret (Settings → Secrets and
      # variables → Actions → INSTAGRAM_FEED_URL), from a Behold JSON feed.
      - name: Fill the Instagram grid
        env:
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
        run: |
          python3 -m pip install --quiet pillow || true
          python3 tools/instagram.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
