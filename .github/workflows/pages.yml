name: Deploy to GitHub Pages

# Publishes the site on every push to main — including every save Fred makes
# in Pages CMS — and every six hours so the Instagram grid on the home page
# keeps up with new posts. Eleventy builds the pages from content/*.yml and
# src/ into _site/; tools/instagram.py then fills the Instagram grid in the
# built home page (it never fails a deploy); _site/ is what is published.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the site
        run: |
          npm ci
          npx @11ty/eleventy

      # The feed address is a repository secret (Settings → Secrets and
      # variables → Actions → INSTAGRAM_FEED_URL), from a Behold JSON feed.
      - name: Fill the Instagram grid
        env:
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
          SITE_DIR: _site
        run: |
          python3 -m pip install --quiet pillow || true
          python3 tools/instagram.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
