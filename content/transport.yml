segments:
  - title: Transport
    text: "From a single painting across town to the relocation of an entire
      collection, we move works between studios, storage, galleries and homes.
      Moves are carried out by dedicated art handlers and vehicles, with trusted
      partners when scale requires it. Every move is planned around the work:
      its route, its packing and the crew it needs."
    photos:
      - image: /assets/img/photos/240726_89.webp
        alt: A technician sliding a large boarded work into place.
      - image: /assets/img/photos/240726_47.webp
        alt: A finished timber crate, marked and labelled.
      - image: /assets/img/photos/240726_43.webp
        alt: A lid being lowered onto a foam-lined case.
      - image: /assets/img/photos/240726_36.webp
        alt: A wrapped work set into a foam-cornered travel frame.
  - title: Packing & Crating
    text: "Bespoke packing, with crating arranged for international shipment for
      storage and transit, built to the requirements of the work. For works
      leaving storage, packing is matched to the journey: soft-wrapping for
      local moves, travel frames and cases for transit within the UK, and
      crating for international shipment."
    photos:
      - image: /assets/img/photos/240726_14.webp
        alt: Gloved hands taping a wrapped work closed.
      - image: /assets/img/photos/240726_17.webp
        alt: Tape run along the edge of a wrapped work.
      - image: /assets/img/photos/240726_19.webp
        alt: A made-to-measure box being closed over a wrapped work.
      - image: /assets/img/photos/240726_32.webp
        alt: Tape drawn across the corner of a wrapped work.
      - image: /assets/img/photos/240726_35.webp
        alt: A boarded work held in foam corners.
      - image: /assets/img/photos/240726_45.webp
        alt: A foam corner fitted to a boarded work.
  - title: Handling
    text: >-
      Our art handlers have decades of experience with paintings, works on
      paper, sculpture, installation, furniture and fragile or unconventional
      media.


      Only trained fine art staff have access to the Fine Art Warehouse. Every
      movement of a work is carried out by a fine art handler. The warehouse is
      equipped to move large crates and heavy sculpture safely.


      In-house, we offer:

      Condition reporting

      Packing, from soft-wrap to bespoke crating

      High-resolution photography

      Installation
  - title: Overview
panel:
  text: Tell us what is moving, from where and to where, and we will come back
    with a plan and a price.
  button: Get in touch
  email_subject: Transport & Handling enquiry
