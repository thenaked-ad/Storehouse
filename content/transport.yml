segments:
  - title: How It Works and Billing
    text: >-
      Packing, transport and installation by specialist art handlers, from a
      single work in London to a full exhibition abroad, for collectors,
      artists, estates and galleries.


      Brief 

      Tell us what needs moving or installing, from where and to where. We check
      sizes, access and timings, and visit if needed.


      Quote 

      You receive a clear quote before anything is booked. Transport and
      installation are charged by the hour, per van and per art handler.
      Packing, crating and condition reports are quoted separately.


      Plan 

      We confirm dates, crew, vehicle and packing, and check access at both
      ends.


      Move 

      Our art handlers collect, pack, transport, and deliver or install your
      works. Anything going into store is logged on arrival.


      Invoice 

      Invoiced on completion, with each item listed. 
  - title: Packing & Crating
    text: >-
      Every work is packed for its medium, its journey and its time in storage,
      to fine art standards.


      Soft-wrap 

      Layered soft packing for works travelling by van or going straight into
      store.


      Travel frames and bespoke crates 

      Built to measure for each work, for air and sea freight, long-term
      storage, and fragile or high-value pieces.


      Records 

      Each packing method is recorded in your inventory, so you always know how
      a work is packed. Photography and condition reports are available on
      request.
  - title: Transport
    text: >
      UK Domestic / Nationwide
       We collect from and deliver to studios, galleries, homes and auction houses across London and the UK. Our dedicated fine art vans are crewed by trained art handlers, and we can pack, unpack and install at either end.

      Air Freight / Worldwide
       Single works or whole exhibitions, flown anywhere in the world. We plan the route and work with our partner shippers on airline handling, airport supervision and agents at destination. Couriers can travel with the work when it’s needed.

      Sea Freight / Worldwide
       A considered option for single works, large sculpture and full collections. We offer shared shipments, or a dedicated container when the work calls for one, and we build bespoke crates for the voyage.
    button: Get in touch for a quote
    email_subject: Quote request
  - title: Installation
    text: >-
      From a single work to a full exhibition, we install and deinstall for
      galleries, artists and private collectors, in London and abroad. Every
      installation is carried out by our own art handlers, with decades of
      experience across paintings, works on paper, sculpture and fragile or
      unconventional media.


      Galleries & art fairs/

      Installs and deinstalls for galleries, artists and curators, from
      unpacking and hanging to plinths, vitrines and heavy works, and full fair
      logistics from collection to close. We can lead or work alongside your
      team. Sold works go straight to their buyers, and unsold works come back
      to store or to you.


      Residential/

      Hanging and installation in private homes, from a single work to a full
      rehang, with floors and surfaces protected throughout. Rotations, new
      acquisitions and house moves too.


      Photography and condition reports are available on request.
