segments:
  - title: How It Works and Billing
    text: >-
      Packing, transport and installation by specialist art handlers, from a
      single work in London to a full exhibition abroad, for collectors,
      artists, estates and galleries.


      Brief 

      Tell us what needs moving or installing, from where and to where. We check
      sizes, access and timings, and visit if needed.


      Quote 

      You receive a clear quote before anything is booked. Transport and
      installation are charged by the hour, per van and per art handler.
      Materials, parking, crating and condition reports are quoted separately.


      Move 

      Our art handlers collect, pack, transport, and deliver or install your
      works. Anything going into store is logged on arrival.


      Invoice 

      Invoiced on completion, with each item listed. 
  - title: Installation & Exhibition Services
    text: >-
      We install single works and full exhibitions for galleries, art fairs,
      museums and private collectors, in London and abroad. We plan each project
      around your deadline, including exhibition design and layout, and our art
      handlers take care of the whole job, from collecting the works to
      deinstalling at the close. When a job needs a specialist, we bring in
      shippers, conservators, framers, fabricators and technicians we trust.


      Installation

      We unpack, hang and deinstall, indoors and out. In private homes we take
      on rehangs, rotations and new acquisitions. Condition reports and
      installation guides are available on request.


      Fabrication

      We build walls, plinths, shelving and exhibition furniture, and fit out
      storage rooms to an specification.
  - title: Transport
    text: >
      UK Domestic

      We collect from and deliver to studios, galleries, homes and auction
      houses across London and the UK. Our dedicated fine art vans are crewed by
      trained art handlers, and we can pack, unpack and install at either end.


      Air Freight

      Single works or whole exhibitions, flown anywhere in the world. We plan
      the route and work with our partner shippers on airline handling, airport
      supervision and agents at destination. 


      Sea Freight

      A considered option for single works, large sculpture and full
      collections. We offer shared shipments, or a dedicated container when the
      work calls for one.
  - title: Packing & Crating
    text: >-
      Every work is packed for its medium, its journey and its time in storage,
      to fine art standards.


      Soft-wrap 

      Layered soft packing for works travelling by van or going straight into
      store.


      Travel frames and bespoke crates 

      Built to measure for each work, for air and sea freight, long-term
      storage, and fragile or high-value pieces.


      Records 

      Each packing method is recorded in your inventory, so you always know how
      a work is packed. Photography and condition reports are available on
      request.
