segments:
  - title: How It Works and Billing
    text: >-
      Fine art handling, packing, transport, and installation by specialist art
      handlers, from a single piece in London to a full exhibition hang abroad.

      We move, pack and install artworks for collectors, artists, estates and
      galleries across the UK and worldwide. 


      Brief. Tell us what needs moving or installing, and where from and to.
      We’ll check sizes, access and timings, and visit if needed.

      Quote. You receive a clear quote before anything is booked. Transport and
      installation are charged by the hour, per van and art handler. Packing,
      crating and condition reports are quoted separately on request.

      Plan. We confirm dates, crew, vehicle and packing, and check access at
      both ends.

      Move. Our art handlers collect, pack, transport, and deliver or install
      your works. Anything going into store is logged on arrival.

      Invoice. You’re invoiced once the job is complete, with each item listed.


      Storage clients: There’s no charge for releasing works from store. You pay
      only for transport, booked with us or with a shipper of your choice.
  - title: Packing & Crating
    text: >-
      Every work is packed with its nature, its journey and its time in storage
      in mind.  Soft-wrap, travel frames and bespoke crates, made for each work.
      Packed with care and built to fine art standards.


      Photography and condition reports are available on request. Each packing
      method is recorded in your inventory, so you always know how your works
      are cared for.
  - title: Transport
    text: >
      UK Domestic / Nationwide
       We collect from and deliver to studios, galleries, homes and auction houses across London and the UK. Our dedicated fine art vans are crewed by trained art handlers, and we can pack, unpack and install at either end.

      Air Freight / Worldwide
       Single works or whole exhibitions, flown anywhere in the world. We plan the route and work with our partner shippers on airline handling, airport supervision and agents at destination. Couriers can travel with the work when it’s needed.

      Sea Freight / Worldwide
       A considered option for single works, large sculpture and full collections. We offer shared shipments, or a dedicated container when the work calls for one, and we build bespoke crates for the voyage.
    button: Get in touch for a quote
    email_subject: Quote request
  - title: Installation
    text: >-
      We install and deinstall works for galleries, art fairs and private
      clients in London and abroad. Every installation is carried out by our own
      art handlers, from a single work to a full exhibition.


      - Gallery. Exhibition installs and deinstalls for galleries, artists and
      curators. This covers unpacking and condition checking, hanging and
      levelling, plinths, vitrines, heavy works and fit-out. At the close, works
      are condition-checked, packed and returned to store or shipped on. We can
      work alongside an in-house team or lead the install.


      - Art fairs. Full fair logistics for galleries. We collect from studios,
      galleries and storage, deliver to the fair, install the booth, and
      deinstall at the close. Works can be condition-reported, photographed and
      packed with us beforehand. Afterwards, unsold works return to store or to
      you, and sold works are delivered to buyers


      - Residential. Hanging and installation in private homes, from single
      works to full rehangs. This includes paintings, sculpture and pieces
      requiring specialist fixings or hanging systems. Floors and surfaces are
      protected throughout. We also handle collection rotations, new
      acquisitions and house moves, with your inventory updated as works move.
  - title: Our Art Handlers
    text: >-
      Our art handlers have decades of experience with paintings, works on
      paper, sculpture, installation, furniture and fragile or unconventional
      media.


      Only trained fine art staff handle works in our care, whether in store, in
      transit or on the wall. Our warehouse is equipped to move large crates and
      heavy sculpture safely, and we bring the same care and kit to each project
      as specified.


      Alongside transport and installation, our team carries out condition
      reporting and photography; see Additional Services.
