segments:
  - title: Transport
    text: "From a single painting across town to the relocation of an entire collection, we move works between studios, storage, galleries and homes. Moves are carried out by dedicated art handlers and vehicles, with trusted partners when scale requires it. Every move is planned around the work: its route, its packing and the crew it needs."
    photos:
      - image: /assets/img/photos/240726_89.webp
        alt: A technician sliding a large boarded work into place.
        caption: ""
      - image: /assets/img/photos/240726_47.webp
        alt: A finished timber crate, marked and labelled.
        caption: ""
      - image: /assets/img/photos/240726_43.webp
        alt: A lid being lowered onto a foam-lined case.
        caption: ""
      - image: /assets/img/photos/240726_36.webp
        alt: A wrapped work set into a foam-cornered travel frame.
        caption: ""
  - title: Packing & Crating
    text: "Bespoke packing, with crating arranged for international shipment for storage and transit, built to the requirements of the work. For works leaving storage, packing is matched to the journey: soft-wrapping for local moves, travel frames and cases for transit within the UK, and crating for international shipment."
    photos:
