segments:
  - title: Overview
    text: >-
      Careful transport, packing and installation by specialist art handlers,
      from a single collection in London to a full exhibition hang abroad.


      We move, pack and install artworks for collectors, artists, estates and
      galleries across London and the home counties. Every job is run by fine
      art handlers, not general removals crews, and planned around the works
      themselves: their size, weight, fragility and where they’re going.


      We can collect from a studio, gallery, home or auction house, take works
      into storage, deliver them on, or install them on arrival. For shipments
      outside the UK, we work with trusted international fine art shippers and
      coordinate the job from start to finish.
  - title: How It Works and Billing
    text: >-
      1. Brief. Tell us what needs moving or installing, where from and where
      to. We’ll ask about sizes, weights, access and timings, and visit the site
      if needed.


      2. Quote. We send you a clear quote before anything is booked. Transport
      and installation are charged per van and art handler, by the hour. Packing
      materials, crating and condition reports are quoted separately where
      needed.


      3. Plan. We confirm dates, crew, vehicle and packing, and check access at
      both ends.


      4. Move. Works are collected, packed, transported and delivered or
      installed by our art handlers. Anything going into store is logged into
      your inventory on arrival.


      5. Invoice. You’re invoiced once the job is complete, with each element
      itemised.


      Storage clients: releasing works from store is never charged. You pay only
      for the transport itself, booked with our team or a shipper of your
      choice.
  - title: Our Art Handlers
    text: >-
      Our art handlers have decades of experience with paintings, works on
      paper, sculpture, installation, furniture and fragile or unconventional
      media.


      Only trained fine art staff handle works in our care, whether in store, in
      transit or on the wall. Our warehouse is equipped to move large crates and
      heavy sculpture safely, and we bring the same care and kit to every site.


      Alongside transport and installation, our team carries out condition
      reporting and high-resolution photography; see Additional Services.
  - title: Vehicles
    text: >-
      Our vans are dedicated to fine art and run with trained art handlers. For
      larger moves, we have access to bigger vehicles through our logistics
      partner on the Park Royal site.


      Works are packed and secured for the journey, and every move is planned in
      advance: access, parking, lifts, stairs and timings are checked before we
      arrive, so the day runs to plan.
  - title: Packing & Crating
    text: >-
      How a work is packed depends on what it is, how far it’s travelling and
      how long it will be stored.


      Soft-wrap. For local moves and climate-controlled storage, we use
      conservation-grade materials, chosen for each work’s surface and medium.


      Card-wrap and travel frames. For added protection on regular moves.


      T-frames. For large paintings and panels moving between venues.


      Bespoke crates. For long-term deep storage, heavy sculpture and
      international shipping, built to suit each work.


      Every work is photographed before packing, and we can provide a full
      condition report. Packing is recorded in your inventory, so you always
      know how each work is protected.
  - title: Installation
    text: >-
      We install and deinstall works for galleries, art fairs and private
      clients in London and abroad. Every installation is carried out by our own
      art handlers, from a single work to a full exhibition.


      Gallery. Exhibition installs and deinstalls for galleries, artists and
      curators. This covers unpacking and condition checking, hanging and
      levelling, plinths, vitrines, heavy works and fit-out. At the close, works
      are condition-checked, packed and returned to store or shipped on. We can
      work alongside an in-house team or lead the install.


      Art fairs. Full fair logistics for galleries. We collect from studios,
      galleries and storage, deliver to the fair, install the booth, and
      deinstall at the close. Works can be condition-reported, photographed and
      packed with us beforehand. Afterwards, unsold works return to store or to
      you, and sold works are delivered to buyers


      Residential. Hanging and installation in private homes, from single works
      to full rehangs. This includes large glass works, mirrors, sculpture and
      pieces requiring specialist fixings or hanging systems. Floors and
      surfaces are protected throughout. We also handle collection rotations,
      new acquisitions and house moves, with your inventory updated as works
      move.
