segments:
  - title: How It Works and Billing
    text: >+
      A single painting moving across London and an exhibition installed abroad
      need very different plans. Every project starts with a conversation and is
      scoped to fit. You have one point of contact from first brief to final
      invoice, a plan and price agreed before anything is booked, and only
      specialist art handlers on the job.

  - title: Installation & Exhibition Services
    text: >-
      We install single works and whole exhibitions in homes, studios, pop-up
      spaces, galleries and institutions, in London and abroad. When a project
      needs other expertise, we bring in specialists we trust.

      - Exhibition design and layout

      - Hanging and deinstallation

      - Collection rotations and rehangs in private homes

      - Pop-up exhibitions

      - Studio clear-outs

      - Walls, plinths, shelving and storage rooms built to order
  - title: Transport
    text: >
      UK Domestic

      We collect from and deliver to studios, galleries, homes and auction
      houses across London and the UK. Our dedicated fine art vans are crewed by
      trained art handlers, and we can pack, unpack and install at either end.


      Air Freight

      Single works or whole exhibitions, flown anywhere in the world. We plan
      the route and work with our partner shippers on airline handling, airport
      supervision and agents at destination. 


      Sea Freight

      A considered option for single works, large sculpture and full
      collections. We offer shared shipments, or a dedicated container when the
      work calls for one.
  - title: Packing & Crating
    text: >-
      Every work is packed to fine art standards, suited to its medium, its
      journey and how long it will be stored. Each packing method is recorded in
      your inventory.


      Soft-wrap 

      Works travelling by road are wrapped in Tyvek, Furniguard and polythene,
      and can be fitted into a bespoke cardboard box.


      Travel frames and bespoke crates 

      Built to measure for each work, for air and sea freight, long-term
      storage, and fragile or high-value pieces.
