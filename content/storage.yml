segments:
  - title: How It Works
    text: >-
      We offer professional fine art storage in Park Royal, London.
      Climate-controlled and ambient space on a bonded site. Specialist art
      handlers. Billing you can understand at a glance. And no fees to bring
      works in or take them out.


      How it works/

      Every work is logged, labelled and shared with you. You always know what’s
      in store, where it is and what it costs.


      Arrival/ 

      We check every work against its paperwork. Unpacked or soft-wrapped works
      are photographed and condition-checked. Self-packed works stay packed
      unless you ask. We photograph and record the packaging and labels instead.


      Labelling/ 

      Each work gets a unique Storehouse reference, alongside your own inventory
      number.


      Recording/ 

      We log artist, title, date, medium, dimensions, packed dimensions, packing
      type, images, condition notes and date received.


      Location/ 

      Each work goes where it’s best suited, with its exact location recorded.
      Nothing is ever hunted for.


      Your inventory/ 

      A full list of every work, its volume and monthly cost, updated whenever
      anything moves in or out.


      Viewing Room/

      See your works by appointment, in private.
  - title: Billing
    text: >-
      Storage is charged by volume, per cubic metre per week, and invoiced
      monthly in arrears. If a work arrives or leaves mid-month, you pay only
      for the days it was with us. Every invoice lines up with your inventory,
      so the cost of each work is clear.


      No release fees. Works leave free of charge, whether by a third-party
      shipper or our own transport team. Logging in and inventory are included
      too. Your storage bill is just your storage bill.


      Charged separately, only when needed and agreed in advance:


      - Condition reports


      - Photography


      - Uncrating, repacking or crating


      - Additional handling beyond a standard release


      Transport is booked and paid for separately, whether with our team or a
      shipper of your choice.
    button: Get in touch to find out about our prices.
    email_subject: "Storage Inquiry "
  - title: The Facility
    text: >-
      Built for art/

      Our secure, purpose-built site sits discreetly in Park Royal, West London,
      with the A40 and North Circular on the doorstep and direct routes into
      central London and across the UK. Rooms large and small take everything
      from a single drawing to a whole collection.


      Climate-controlled/ Perfect for paintings, works on paper, photographs,
      textiles and anything sensitive. Stable temperature and humidity all year
      mean less movement in canvas, panel and paper, and no surprises when a
      work comes out.


      Ambient/ Ideal for crated or T-framed works, from large paintings to
      sculpture and long-term deep storage.


      Both storages are monitored around the clock, we’ll advise which suits
      each work and we’ll repack anything that needs it.


      Bonded storage/

      The whole site is an HMRC-approved bonded warehouse. Hold works from
      abroad with import VAT and duty suspended, pay only if a work is released
      into UK circulation, and nothing at all if it’s re-exported. Perfect for
      fairs, sales, exhibitions and onward shipping through London. We’ll manage
      the paperwork with your shipper or customs agent.
  - title: Security & Insurance
    text: >-
      Protecting your works is at the heart of what we do. Here’s how we keep
      them safe.


      Perimeter/ Palisade fencing, coded pedestrian access, radio-controlled
      vehicle gates and reception manned seven days a week.


      Restricted entry/ The temperature-controlled Fine Art Warehouse has one
      entrance with two-stage keypad access. Alarmed fire exits allow no
      external entry. Climate-controlled rooms are secured by video entry and
      deadlocks. Only qualified fine art technicians and senior staff have
      access.


      Intruder alarms/ The warehouse’s own motion-sensor alarm links directly to
      the police; only senior staff can unset it. A site-wide alarm uses
      dual-path monitoring through an independent alarm receiving centre.


      CCTV/ HD cameras cover every access point, door and loading shutter, plus
      20+ external cameras and a 30-day archive.


      Fire/ Automatic detection to L1 P2 standard, professionally monitored and
      linked directly to the fire service, with a typical response of three
      minutes. Foam, dry powder and CO2 extinguishers serviced annually.


      Insurance/ Works must be insured: extend your own policy, or use our All
      Risks Fine Art cover. Insurers are welcome to inspect.
