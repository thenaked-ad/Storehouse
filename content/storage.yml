segments:
  - title: How It Works
    text: >
      Professional fine art storage in Park Royal, London, on a bonded site,
      with climate-controlled and ambient space and specialist art handlers.
      There are no fees to bring works in or take them out, and every work is
      logged, labelled and shared with you, so you always know what is in store,
      where it is and what it costs.


      Arrival

      Every work is checked against its paperwork. Unpacked and soft-wrapped
      works are photographed and condition-checked. Works that arrive packed
      stay packed unless you ask otherwise; we photograph and record the
      packaging and labels instead.


      Labelling & recording

      Each work receives a unique Storehouse reference alongside your own
      inventory number. We record artist, title, date, medium, dimensions,
      packed dimensions, packing type, images, condition notes and date
      received.


      Location & inventory

      Each work is placed in the storage best suited to it, and its exact
      location is recorded. Your inventory lists every work with its volume and
      monthly cost, updated whenever anything moves in or out.
  - title: Billing
    text: >-
      Storage 

      Charged by volume, per cubic metre per week, and invoiced monthly in
      arrears. Works arriving or leaving mid-month are charged only for the days
      they are with us. Every invoice matches your inventory, so the cost of
      each work is clear.


      No release fees 

      Works leave free of charge, whether collected by a third-party shipper or
      by our own team. Logging in and inventory are included. Your storage bill
      is just your storage bill.


      Additional services 

      Agreed in advance and charged separately: condition reports, photography,
      uncrating, repacking or crating, and handling beyond a standard release.


      Transport 

      Booked and paid for separately, with our team or a shipper of your choice.
    button: Get in touch
    email_subject: "Storage Inquiry "
  - title: The Facility
    text: >-
      Our secure site sits discreetly in Park Royal, West London, with the A40
      and North Circular on the doorstep and direct routes into central London
      and across the UK. Rooms large and small take anything from a single
      drawing to a whole collection.


      Climate-controlled

      Stable temperature and humidity all year, for paintings, works on paper,
      photographs, textiles and other sensitive media. Conditions are held
      within the Government Indemnity Scheme guidelines: relative humidity
      between 40% and 65%, and temperature between 16°C and 24°C. 


      Ambient

      For crated and T-framed works, large paintings, sculpture and long-term
      deep storage.


      Both are monitored around the clock. We advise which suits each work and
      repack anything that needs it.


      Bonded storage

      The whole site is an HMRC-approved bonded warehouse. Works from abroad can
      be held with import VAT and duty suspended: payable only if a work is
      released into UK circulation. We manage the paperwork with your shipper or
      customs agent.
  - title: Security & Insurance
    text: >-
      Perimeter 

      Palisade fencing, coded pedestrian access, radio-controlled vehicle gates
      and a reception staffed seven days a week.


      Restricted entry 

      The Fine Art Warehouse has a single entrance with two-stage keypad access,
      and alarmed fire exits with no external entry. Climate-controlled rooms
      are secured by video entry and deadlocks. Access is limited to qualified
      fine art technicians and senior staff.


      Alarms 

      The warehouse's motion-sensor alarm links directly to the police and can
      only be unset by senior staff. A site-wide alarm is dual-path monitored
      through an independent alarm receiving centre.


      CCTV 

      HD cameras cover every access point, door and loading shutter, with over
      20 external cameras and a 30-day archive.


      Fire Automatic 

      detection to L1 P2 standard, professionally monitored and linked directly
      to the fire service, with a typical response time of three minutes.
      Extinguishers are serviced annually.


      Insurance 

      Works must be insured, either under your own policy or under our All Risks
      Fine Art cover by prior agreement. Insurers are welcome to inspect.
