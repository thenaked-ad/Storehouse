segments:
  - title: Overview
    text: Professional fine art storage in Park Royal, London. We offer
      climate-controlled and ambient space on a bonded site, specialist art
      handlers, and billing you can understand at a glance.
  - title: The Facility
    text: >-
      Our storage is within a secure, purpose-built logistics site in Park
      Royal, West London. It is discreet and close to the A40 and North
      Circular, with direct routes into central London and out to the home
      counties.


      This is a professional warehouse and built to receive, handle and store
      artworks and sculpture of any size, from a single drawing to a large
      crate. We have both large and small rooms, so a single work and a whole
      collection can each be stored in a space that suits them.
  - title: Climate Control and Ambient Storage
    text: >-
      We offer two types of storage, and we’ll advise work by work on which is
      right.


      Climate-controlled. This is for works that are soft-wrapped or
      card-wrapped: paintings, works on paper, photographs, textiles and
      anything sensitive to its environment. Temperature and relative humidity
      are held stable year-round, which means less movement in canvas, panel and
      paper, and no surprises when a work comes back out.


      Ambient. This is for works that are crated or T-framed. The crate or frame
      buffers the work, which makes ambient storage the right home for
      large-format paintings, sculpture and works going into long-term deep
      storage.


      Monitored throughout. Temperature and humidity are logged continuously
      across both, so we can show you the conditions your works have been kept
      in at any point. Where needed, we repack works so each piece is stored the
      way it should be.
  - title: Bonded Storage
    text: >-
      The whole site is a bonded warehouse operating under HMRC customs
      approval.


      Works arriving from outside the UK can be held in store with import VAT
      and duty suspended. Tax is paid only if and when a work is released into
      free circulation in the UK. If the work is re-exported, nothing is paid.


      For collectors, dealers and galleries moving work through London for
      fairs, sales, exhibitions or onward shipping, this means no tax tied up in
      transit. The paperwork is handled properly, and works are kept in a fully
      controlled, audited environment. We work with your shipper or customs
      agent to manage entries and documentation from arrival to release.
  - title: Security & Insurance
    text: >-
      We take the security of the works in our care seriously. When you store
      art professionally, you should be able to satisfy yourself and your
      insurer that the facility takes it seriously too. These are the measures
      in place.


      Perimeter and reception.

      The site is enclosed by palisade fencing with electronically controlled
      gates and controlled access for pedestrians and vehicles. Reception is
      manned seven days a week.


      Restricted entry.

      The Fine Art Warehouse has a single entrance with two-stage keypad access.
      The fire exits are alarmed at all times and allow no external entry. The
      climate-controlled rooms are secured by video entry and deadlocks.


      Intruder alarms.

      The fine art spaces have their own independent alarm with motion
      detection. It is linked directly to the police and can be unset only by
      designated senior staff. A separate site-wide alarm is monitored around
      the clock through an independent alarm receiving centre.


      CCTV.

      High-definition internal and external cameras cover every access point,
      entrance and loading shutter. A wider site system provides full external
      coverage with a recorded archive.


      Fire detection.

      Automatic fire detection runs throughout and is professionally monitored
      and linked directly to the fire service, with a typical response time of
      minutes. Extinguishers and fire blankets are provided throughout and
      regularly serviced.


      Environmental monitoring.

      Temperature and humidity are logged continuously across both
      climate-controlled and ambient storage.


      Inspection welcome.

      We welcome inspection by any insurer to review our security set-up and
      processes.


      Insurance.

      Works in our care must be insured. Most clients extend their own fine art
      policy to cover works in store. We ask every client to make sure they are
      comfortable with their own cover while their works are with us.
  - title: How It Works
    text: >-
      Every work that comes into store is logged, labelled and shared with you.
      You always know what is in storage, where it is, and what it is costing
      you.


      Arrival. Works are checked in against the paperwork. Works arriving
      unpacked or soft-wrapped are photographed and condition-checked. Works you
      have packed yourself stay packed unless you ask us to open them; we
      photograph and record the packaging and labels instead.


      Labelling. Each work is given a unique Storehouse reference, which sits
      alongside your own inventory number.


      Recording. Each work is logged in our inventory with its artist, title,
      date, medium, dimensions, packed dimensions, packing type, images,
      condition notes and date received.


      Location. Each work is placed in the storage best suited to it, and its
      exact location is recorded. Nothing is ever hunted for.


      Your inventory. We send you a full inventory showing every work, its
      volume and its monthly storage cost. It is updated whenever something
      comes in or goes out.
  - title: Billing
    text: >-
      Storage is charged by volume, per cubic metre per week, and invoiced
      monthly in arrears. If a work arrives or leaves mid-month, you pay only
      for the days it was with us. Every invoice lines up with your inventory,
      so the cost of each work is clear.


      No release fees. We don’t charge to release a work, whether it leaves with
      a third-party shipper or with our own transport team. Logging in and
      inventory are included. Many storage providers charge every time a work
      moves. We don’t, so your storage bill is simply your storage bill.


      Charged separately, only when needed and agreed in advance:


      Condition reports

      Photography

      Uncrating, repacking or crating

      Additional handling beyond a standard release


      Transport is booked and paid for separately, whether with our team or a
      shipper of your choice.
  - title: Handling
    text: >-
      Our art handlers have decades of experience with paintings, works on
      paper, sculpture, installation, furniture and fragile or unconventional
      media.


      Only trained fine art staff have access to the Fine Art Warehouse. Every
      movement of a work is carried out by a fine art handler. The warehouse is
      equipped to move large crates and heavy sculpture safely.


      In-house, we offer:

      Condition reporting

      Packing, from soft-wrap to bespoke crating

      High-resolution photography

      Installation
  - title: Viewing Room
    text: >-
      Our Viewing Room is a private space where works can be viewed, studied and
      photographed under controlled conditions. It is used by collectors,
      curators, conservators and buyers. By appointment, our staff install the
      works for you, so the room is ready when you arrive.


      A large hanging wall, approximately 6 × 4 m, built to take anything from
      small, light works to heavy pieces

      Gallery lighting by TM Lighting

      Concrete floor, suited to sculpture and heavy objects

      Holding storage on site for works waiting to be installed

      Kitchen and bathroom

      Tools and art technicians available for hire
