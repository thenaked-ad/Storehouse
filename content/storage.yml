segments:
  - title: How It Works
    text: >-
      Fine art storage on a **bonded site** in Park Royal, London, with
      **climate-controlled** and **ambient** space and **specialist art
      handlers**.


      Every work is checked in against its paperwork, given a Storehouse
      reference alongside your own inventory number, and placed in the storage
      best suited to it. Unpacked works are photographed and condition-checked.
      Packed works stay packed unless you ask otherwise, and we record the
      packaging instead. Everything is logged in your inventory, so you always
      know what’s in store and there **no fees to release work**. 
  - title: Billing
    text: >+
      Storage 

      Charged by volume, per cubic metre per week, and invoiced monthly in
      arrears. Works arriving or leaving mid-month are charged only for the days
      they are with us. Every invoice matches your inventory, so the cost of
      each work is clear.


      No release fees 

      Works leave free of charge, whether collected by a third-party shipper or
      by our own team. Intake and inventory are included. Your storage bill is
      just your storage bill.


      Additional services 

      Agreed in advance and charged separately: transport, condition reports,
      photography, uncrating, repacking or crating, and handling beyond a
      standard release.

    button: Get in touch
    email_subject: "Storage Inquiry "
  - title: The Facility
    text: >-
      Our secure site sits discreetly in Park Royal, West London, with the A40
      and North Circular on the doorstep and direct routes into central London
      and across the UK. Rooms large and small take anything from a single
      drawing to a whole collection.


      Climate-controlled

      Stable temperature and humidity all year, for paintings, works on paper,
      photographs, textiles and other sensitive media. Temperature is held
      between 16°C and 24°C and relative humidity between 40% and 65%, all year
      round.


      Ambient

      For crated and T-framed works, large paintings, sculpture and long-term
      deep storage. We advise which suits each work and repack anything that
      needs it.


      Bonded storage

      The whole site is an HMRC-approved bonded warehouse. Works arriving from
      abroad can be held with import VAT and duty suspended, payable only if a
      work enters UK circulation. We handle the paperwork with your shipper or
      customs agent.
  - title: Security & Insurance
    text: >-
      Security

      The site is secured by palisade fencing, coded gates and a reception
      staffed seven days a week. The Fine Art Warehouse has a single
      keypad-controlled entrance, and the climate-controlled rooms have video
      entry and deadlocks, with access limited to our art technicians and senior
      staff. Intruder alarms are monitored around the clock and linked directly
      to the police. HD cameras cover every entrance, door and loading bay, and
      automatic fire detection is linked directly to the fire service.


      Insurance

      Works in our care stay under your own insurance, which should cover
      storage, handling and transport for their full value. To help your insurer
      extend cover, we can provide a facility report, security details and
      environmental data, and insurers are welcome to visit.
