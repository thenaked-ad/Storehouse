segments:
  - title: Photography
    text: Photography of artworks to reproduction standard, for catalogues, websites, insurance, loans and archives. Works are photographed on a Fujifilm GFX medium-format system in the controlled conditions of our viewing room, and processed in Capture One and Photoshop for accurate colour and detail. Our photography has been used across gallery and artist websites. Works already in our care can be photographed without leaving the building.
    button: Book photography
    email_subject: Photography enquiry
