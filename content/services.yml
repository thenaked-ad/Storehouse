segments:
  - title: Overview
    text: "We work with collectors, artists, estates and galleries over the long
      term, running the back end of a collection or gallery inventory: storage,
      records, images, condition, movement and projects, held in one place and
      handled by one team."
  - title: Photography
    text: >-
      Gallery-standard photography of artworks, carried out entirely in-house.
      Our images are used on gallery and artist websites, in catalogues and
      sales materials, and in collection archives. Everything is shot on
      100-megapixel medium-format equipment and delivered ready for print,
      online and archive use.


      In store 

      Works in our care can be photographed on site in the Viewing Room, under
      controlled conditions and with no transport needed. From a single work to
      a whole collection, with reduced rates for larger volumes.


      On location 

      We travel to studios, galleries and private collections to shoot on site.
  - title: Viewing Room
    text: >-
      Our Viewing Room is a private space where works can be viewed, studied and
      photographed under controlled conditions. It is used by collectors,
      curators, conservators and buyers. By appointment, our staff install the
      works for you, so the room is ready when you arrive.


      - A large hanging wall, approximately 6 × 4 m, built to take anything from
      small, light works to heavy pieces


      - Gallery lighting by TM Lighting


      - Concrete floor, suited to sculpture and heavy objects


      - Holding storage on site for works waiting to be installed


      - Kitchen and bathroom


      - Tools and art technicians available for hire
  - title: Exhibition Services
    text: >-
      (Presentation to be added) 

      We manage exhibitions from the first plans down to the very last detail,
      including logistics, handling, installation and dismantling. Our team has
      turned numerous of visions into reality, and our clients’ satisfaction
      drives us every single day.
  - title: Artists Estates & Collection Management
    text: >-
      Artists’ estates/


      We work with artists’ families and executors to bring artwork inventories
      under control. This covers cataloguing the studio and archive,
      photographing the work, storage, and helping coordinate loans and
      exhibitions.


      Where specialist advice is needed, we introduce trusted advisers in
      valuation, estate tax and conservation. Throughout, the estate’s record
      stays complete and in one place.


      Collection management/


      For private collections and artist inventories, we build and maintain a
      single, complete record of every work.


      Each work is catalogued with its artist, title, date, medium, dimensions,
      edition, provenance, exhibition history, literature, insurance values and
      location, together with images and documents. In store, at home, on loan
      or in transit, every work is tracked in one database, and that database
      belongs to you.


      We handle insurance schedules, loan requests, rotations and rehangs, new
      acquisitions, and shipping and provenance history to share with curators,
      dealers and advisers.


      Most clients begin with a collection audit: we visit, review what exists
      and set out how we would bring it together.
