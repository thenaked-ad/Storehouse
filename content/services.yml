segments:
  - title: Overview
    text: >-
      We work closely with a number of collectors, artists, estates and
      galleries and over the long term. For them, we run the back end of a
      collection or gallery inventory: storage, records, images, condition,
      movement and projects, all held in one place and handled by one team.


      Because we store, handle, photograph and catalogue the works ourselves,
      nothing is passed between suppliers and nothing falls between the gaps.
      You have one point of contact and a complete record of everything you own.
  - title: Photography
    text: >-
      We specialise in photography of artworks to gallery standard, carried out
      entirely in-house. Our images have been used on gallery and artist
      websites, in catalogues and sales materials, and in collection archives.


      In store. Most works in our care can be photographed on site in our
      Viewing Room, under controlled conditions and with no transport required.
      We’re happy to shoot a single work or an entire collection, and our rates
      are especially competitive for larger volumes.


      On location. We also travel to studios, galleries and private collections
      to shoot inventory on site.


      What we shoot. High-resolution, colour-accurate reproduction images for
      catalogues, sales, insurance and archive, plus detail, signature, label
      and verso images for documentation and condition records. Everything is
      shot on 100-megapixel medium-format equipment and images are delivered as
      high-resolution files, ready for print, online and archive use.
  - title: Viewing Room
    text: >-
      Our Viewing Room is a private space where works can be viewed, studied and
      photographed under controlled conditions. It is used by collectors,
      curators, conservators and buyers. By appointment, our staff install the
      works for you, so the room is ready when you arrive.


      A large hanging wall, approximately 6 × 4 m, built to take anything from
      small, light works to heavy pieces


      Gallery lighting by TM Lighting


      Concrete floor, suited to sculpture and heavy objects


      Holding storage on site for works waiting to be installed


      Kitchen and bathroom


      Tools and art technicians available for hire
  - title: Condition Reporting
    text: >-
      Clear, consistent written reports with annotated images, prepared by
      experienced art handlers. Reports are produced on arrival, before and
      after loans, ahead of sale or shipping, and as part of periodic collection
      reviews.


      Every report is held against the work’s record, so its condition history
      builds over time. This gives you a reliable reference for insurers,
      borrowers, buyers and conservators.
