segments:
  - title: Overview
    text: >-
      We run the behind-the-scenes work for private collectors, artists and
      artist estates. That means the records, images, condition, storage and
      movement of every work, all kept in one place and handled by one team.


      We're a small team from the art world, with backgrounds in art history,
      commercial galleries and fine art handling. We've catalogued thousands of
      works, moved and stored hundreds and helped advise, coordinate and handle
      countless exhibitions and projects.
  - title: Private Collectors
    text: >-
      A collection grows faster than the records kept on it. We can:

      - Build a database that belongs to you. One record per work, covering
      provenance, exhibition history, literature, insurance value and location

      - Photograph every work in high resolution, for insurance, loans and your
      records

      - Store works not on display, in climate-controlled or ambient space

      - Move works between homes, into storage and out on loan, soft-wrapped for
      UK journeys or crated for long-term storage and overseas

      - Manage rotations, rehangs and the installation of new acquisitions

      - Introduce trusted valuers, insurers and conservators where needed
  - title: Artists
    text: |-
      We keep track of the studio so the artist can keep working. We can:
      - Inventory new and existing work as it's made
      - Photograph every work, ready for websites, catalogues and sales
      - Store work between exhibitions or not on display
      - Handle exhibition projects, studio clear-outs, moves and loans
  - title: Artist Estates
    text: >-
      We work with families and executors to bring an estate under control. We:

      - Catalogue the studio and archive into one complete record

      - Photograph every work, to a standard for catalogues, sales and the
      archive

      - Provide secure, long-term storage for the estate

      - Advise, coordinate and handle exhibitions, projects and loans

      - Introduce trusted advisers on valuation, estate tax and conservation
