  - title: Project Management
    text: |-
      We manage projects from start to finish, to deadline. That might be an exhibition in a gallery, at an art fair or pop-up venue, or a collection moving from one home to another.

      For exhibitions, we handle everything from planning and exhibition design to wall builds, display furniture, installation and deinstallation. For collection moves, we take care of the whole process: packing and moving the works, storing them in between if needed, and installing them in their new home. We can also design and fit out storerooms and storage at the new location.

      Years of putting on shows have given us a trusted network of shippers, conservators, framers, fabricators and technicians. We bring in the right people for each project and coordinate them, so you deal with one point of contact throughout.
    button: Discuss a project
    email_subject: Project management enquiry
    photos:
