  - title: Collection & Estate Management
    text: |-
      Whether an artist’s estate or a growing private collection, the documentation rarely keeps pace with the works. Records end up spread across spreadsheets, correspondence and invoices. We bring them together into one accurate, complete record, owned and controlled by you.

      Each work is catalogued in a dedicated database, in Artlogic or ArtBinder, with images, provenance, condition, location, and exhibition and shipping history held in one place. We keep the record current through acquisitions, loans, rotations and rehangs.

      The result supports insurance, valuation, loans and sales, and lets a work’s history be shared with curators and dealers on request.

      We begin with a collection audit or a visit to see the works in situ. Where needed, we introduce trusted valuers, estate and tax advisers, conservators and framers.
    button: Book a collection audit
    email_subject: Collection audit request
