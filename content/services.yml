segments:
  - title: Overview
    text: >-
      We work closely with a number of collectors, artists, estates and
      galleries and over the long term. For them, we run the back end of a
      collection or gallery inventory: storage, records, images, condition,
      movement and projects, all held in one place and handled by one team.


      Because we store, handle, photograph and catalogue the works ourselves,
      nothing is passed between suppliers and nothing falls between the gaps.
      You have one point of contact and a complete record of everything you own.
  - title: Photography
    text: >-
      We specialise in photography of artworks to gallery standard, carried out
      entirely in-house. Our images have been used on gallery and artist
      websites, in catalogues and sales materials, and in collection archives.


      In store. Most works in our care can be photographed on site in our
      Viewing Room, under controlled conditions and with no transport required.
      We’re happy to shoot a single work or an entire collection, and our rates
      are especially competitive for larger volumes.


      On location. We also travel to studios, galleries and private collections
      to shoot inventory on site.


      What we shoot. High-resolution, colour-accurate reproduction images for
      catalogues, sales, insurance and archive, plus detail, signature, label
      and verso images for documentation and condition records. Everything is
      shot on 100-megapixel medium-format equipment and images are delivered as
      high-resolution files, ready for print, online and archive use.
  - title: Condition Reporting
    text: >-
      Clear, consistent written reports with annotated images, prepared by
      experienced art handlers. Reports are produced on arrival, before and
      after loans, ahead of sale or shipping, and as part of periodic collection
      reviews.


      Every report is held against the work’s record, so its condition history
      builds over time. This gives you a reliable reference for insurers,
      borrowers, buyers and conservators.
    photos:
      - image: /assets/img/photos/240726_111.webp
        alt: A large painting being hung on the wall of an interior.
      - image: /assets/img/photos/240726_62.webp
        alt: A framed work being lifted into place on a wall.
      - image: /assets/img/photos/240726_95.webp
        alt: A tape measure run across the face of a board.
  - title: Collection Management
    text: >-
      For private collections and artist inventories, we build and maintain a
      single, complete record of every work.


      Cataloguing. Artist, title, date, medium, dimensions, edition, provenance,
      exhibition history, literature, insurance values and location, together
      with images and documents.


      One database, wherever the works are. In store, at home, on loan or in
      transit, every work is tracked in one place.


      Ongoing management. We handle insurance schedules, loan requests,
      rotations and rehangs, new acquisitions, and shipping and provenance
      history to share with curators, dealers and advisers.


      The database belongs to you. Most clients begin with a collection audit:
      we visit, review what exists and set out how we would bring it together.
  - title: Project Management
    text: >-
      We manage projects from start to finish, to deadline. That might be an
      exhibition in a gallery, at an art fair or pop-up venue, or a collection
      moving from one home to another.


      For exhibitions, we handle everything from planning and exhibition design
      to wall builds, display furniture, installation and deinstallation. For
      collection moves, we take care of the whole process: packing and moving
      the works, storing them in between if needed, and installing them in their
      new home. We can also design and fit out storerooms and storage at the new
      location.


      Years of putting on shows have given us a trusted network of shippers,
      conservators, framers, fabricators and technicians. We bring in the right
      people for each project and coordinate them, so you deal with one point of
      contact throughout.
    button: Discuss a project
    email_subject: Project management enquiry
    photos:
      - image: /assets/img/photos/240726_88.webp
