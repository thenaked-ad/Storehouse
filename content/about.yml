text: |-
  Storehouse Fine Arts was founded from a simple observation: collectors, artists and estates all need the same infrastructure — a safe place to keep work, reliable hands to move and install it, and clear records to make sense of it. We are art people who do logistics, not logistics people who do art. Every work we store, wrap, hang, or catalogue is handled by people who understand what it is and why it matters.

  Founder Fred Henderson trained at the Courtauld Institute and has worked across the commercial gallery world, before founding Storehouse. The business operates from a purpose-fitted facility in north-west London, with a longer-term ambition to build dedicated storage and exhibition space that lets private collections be shared with the public.
