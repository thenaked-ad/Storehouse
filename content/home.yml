overview: >-
  Storehouse is run by art people who do logistics, not logistics people who do
  art. 


  For collectors, artists and estates, we store, move, install and catalogue
  work, from a single piece to a whole collection and from a pop-up exhibition
  to the long-term care of an estate. Our team comes from the art world, so we
  know what each work is, how it was made and what it needs.
instagram_heading: Follow us on Instagram for some of our recent work.
panel:
  text: Whatever you need moved, stored, photographed, catalogued or hung, we’d be
    glad to hear about it.
  button: Get in touch
  email_subject: Enquiry
