overview: >-
  Storehouse is run by art people who do logistics, not logistics people who do
  art. Our team comes from the art world, so when we wrap, crate, hang or
  catalogue a work, we understand what it is, how it was made and what it needs.


  We look after collectors, artists, estates and galleries, from a single hang
  to the rehang of an entire collection. Take as much or as little as you need:
  storage on its own, a one-off move or install, or the full service, where we
  keep your works, keep their records current and manage everything that happens
  to them. Instead of juggling a storage company, shipper, installer,
  photographer and cataloguer, you deal with one team who coordinates it all.
instagram_heading: Follow us on Instagram for some of our recent work.
panel:
