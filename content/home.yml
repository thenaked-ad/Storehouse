overview: >-
  Storehouse is run by art people who do logistics, not logistics people who do
  art. Our team comes from the art world, so when we wrap, crate, hang or
  catalogue a work, we understand what it is, how it was made and what it needs.


  We look after collectors, artists, estates and galleries, whether that’s a
  single install, the move of a whole collection, a gallery exhibition from
  first plan to final deinstall, or the long-term care and cataloguing of an
  estate. One service or all of them, you deal with one team, and we coordinate
  the rest.
instagram_heading: Follow us on Instagram for some of our recent work.
panel:
  text: Whatever you need moved, stored, photographed, catalogued or hung, we’d be
