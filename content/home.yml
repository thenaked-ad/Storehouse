overview: >-
  Storehouse looks after collections for artists, artists’ estates and
  collectors. We store, catalogue, move and install work, and keep one clear
  record of every piece: where it is, its condition and its history. That record
  is what lets a collection be lent, exhibited, published or passed on.


  Our team comes from running galleries, studios and collections, and we care
  about art as much as the people who own it. Everything in our care is kept at
  our specialist facility in North West London, set up for works of every shape
  and size.
instagram_heading: Follow us on Instagram for some of our recent work.
panel:
  text: Whether it’s a private collection, an artist’s studio or an entire estate,
